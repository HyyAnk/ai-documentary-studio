<!doctype html>
<html><head><meta charset="utf-8"><title>Quiz pipeline proof</title><style>
:root{color-scheme:dark;--ink:#18212b;--cream:#fff8e8;--yellow:#ffd65a;--coral:#ff7866;--mint:#73d6bd;--blue:#78b9ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Arial,sans-serif}body{color:var(--cream)}#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(circle at 18% 10%,#31445c 0,#18212b 45%,#111820 100%)}#stage:before{content:"";position:absolute;inset:0;opacity:.17;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:34px 34px}section.clip{position:absolute;inset:0;padding:125px 160px 100px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.scene-kicker{padding:14px 24px;border:4px solid var(--yellow);border-radius:999px;color:var(--yellow);font-size:34px;font-weight:800;letter-spacing:.14em}section.clip h1{max-width:1420px;margin:36px 0 42px;color:var(--cream);font-size:82px;line-height:1.04;letter-spacing:-.04em}.answer-grid{display:grid;grid-template-columns:repeat(3,220px);gap:24px;margin-bottom:38px}.answer-grid div{padding:22px 10px;border-radius:26px;color:var(--ink);font-size:64px;font-weight:900}.answer-grid div:nth-child(1){background:var(--coral)}.answer-grid div:nth-child(2){background:var(--mint)}.answer-grid div:nth-child(3){background:var(--blue)}.voice-line{max-width:1180px;margin:0;color:#dce7ef;font-size:31px;line-height:1.35}.countdown{display:flex;gap:14px;margin-top:34px}.countdown span{width:18px;height:18px;border-radius:50%;background:var(--yellow)}.sparkle{position:absolute;color:var(--yellow);font-size:88px}.sparkle-one{top:120px;left:190px}.sparkle-two{right:210px;bottom:150px;color:var(--coral)}
</style></head><body><main id="stage" data-composition-id="quiz-proof" data-no-timeline data-start="0" data-width="1920" data-height="1080" data-duration="13.48" data-fps="30"><section id="scene-1" class="clip" data-start="0" data-duration="6.74" data-track-index="0"><div class="scene-kicker">QUESTION 1</div><h1>Which animal is the fastest on land?</h1><div class="answer-grid"><div>A</div><div>B</div><div>C</div></div><p class="voice-line">Take a guess. The answer is the cheetah.</p><div class="countdown"><span></span><span></span><span></span></div><div class="sparkle sparkle-one">✦</div></section><section id="scene-2" class="clip" data-start="6.74" data-duration="6.74" data-track-index="0"><div class="scene-kicker">QUESTION 2</div><h1>Which planet is known as the Red Planet?</h1><div class="answer-grid"><div>A</div><div>B</div><div>C</div></div><p class="voice-line">Lock in your answer. It is Mars.</p><div class="countdown"><span></span><span></span><span></span></div><div class="sparkle sparkle-two">✦</div></section><audio id="quiz-narration" class="clip" data-start="0" data-duration="13.48" data-track-index="2" data-volume="1" src="audio.wav"></audio></main><script>window.__playerReady=true;window.__renderReady=true;</script></body></html>
